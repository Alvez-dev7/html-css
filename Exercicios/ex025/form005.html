<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Formulário</h1>
    <form action="cadastro.php">
        <p>
            <fieldset>
                <legend>Sexo</legend>
                <input type="radio" name="sexo" id="imas" value="M">
                <label for="imas">Masculino</label> <br>
                <input type="radio" name="sexo" id="ifem" value="F" checked>
                <label for="ifem">Feminino</label>
            </fieldset>

            <fieldset>
                <legend>Esportes favoritos</legend>
                <input type="checkbox" name="fut" id="ifut"> <label for="ifut">Futebol</label> <br>
                <input type="checkbox" name="vol" id="ivol"> <label for="ivol">Volei</label> <br>
                <input type="checkbox" name="hexa" id="ihexa"> <label for="ihexa">O  hexa vem?</label> <br>
            </fieldset>

            <input type="reset" value="Limpar">
            <input type="submit" value="Enviar">

        </p>
    </form>
</body>
</html>
